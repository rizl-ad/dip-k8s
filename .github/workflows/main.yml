name: Deploy Kubernetes cluster

on:
  # pull_request:
  #   branches: [ main ]
  workflow_dispatch:
  repository_dispatch:
    types: [ deploy-k8s ]

permissions:
  contents: read
  pull-requests: write

jobs:

  ansible-playbook:
    name: Run Ansible playbook
    runs-on: ubuntu-24.04

    env:
      AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
      AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
      # AWS_DEFAULT_REGION: ${{ vars.AWS_DEFAULT_REGION }}
      # YC_BUCKET: ${{ vars.YC_BUCKET }}

    steps:
      - name: Clone repository on runner
        uses: actions/checkout@v4

      - name: Setup SSH agent
        uses: webfactory/ssh-agent@v0.10.0
        with:
          ssh-private-key: ${{ secrets.SSH_KEY }}
          log-public-key: false

      - name: Generate token
        id: generate_token
        uses: actions/create-github-app-token@v1
        with:
          app-id: ${{ secrets.APP_ID }}
          private-key: ${{ secrets.APP_PRIVATE_KEY }}
          owner: ${{ github.repository_owner }}
          repositories: |
            dip-yc
            dip-k8s

      - name: Read variables from dip-yc repository
        env:
          GH_TOKEN: ${{ steps.generate_token.outputs.token }}
        run: |
          VAR_AWS_DEFAULT_REGION=$(gh variable get AWS_DEFAULT_REGION --repo "rizl-ad/dip-yc")
          VAR_YC_INFRA_BUCKET=$(gh variable get YC_INFRA_BUCKET --repo "rizl-ad/dip-yc")
          VAR_TF_BACKEND_S3=$(gh variable get TF_BACKEND_S3 --repo "rizl-ad/dip-yc")
          VAR_ANSIBLE_INVENTORY=$(gh variable get ANSIBLE_INVENTORY --repo "rizl-ad/dip-yc")
          VAR_ANSIBLE_INVENTORY_KEY=$(echo "$VAR_ANSIBLE_INVENTORY" | jq -r '.dir_path + "/" + .name')
          echo "AWS_DEFAULT_REGION=$VAR_AWS_DEFAULT_REGION" >> $GITHUB_ENV
          echo "TF_BACKEND_S3=$VAR_TF_BACKEND_S3" >> $GITHUB_ENV
          echo "ANSIBLE_INVENTORY_KEY=$VAR_ANSIBLE_INVENTORY_KEY" >> $GITHUB_ENV
          {
            echo "YC_INFRA_BUCKET<<EOF"
            echo "$VAR_YC_INFRA_BUCKET"
            echo "EOF"
          } >> $GITHUB_ENV

      # - name: Check required files
      #   run: |
      #     set -euo pipefail

      #     check_file () {
      #       local key="$1"
      #       aws s3api head-object \
      #         --bucket "${{ github.event.client_payload.bucket }}" \
      #         --key "$key" \
      #         --endpoint-url "${{ github.event.client_payload.endpoint }}" > /dev/null 2>&1 || \
      #         { echo "File $key not found. Run the Terraform yc-infra project."; exit 1; }
      #     }

      #     check_file "${{ github.event.client_payload.key }}"
      #     echo "The required files were found."

      - name: Check required files
        run: |
          set -euo pipefail

          check_file () {
            local key="$1"
            aws s3api head-object \
              --bucket "${{ fromJSON(env.YC_INFRA_BUCKET).name }}" \
              --key "$key" \
              --endpoint-url "$TF_BACKEND_S3" > /dev/null 2>&1 || \
              { echo "File $key not found. Run the Terraform yc-infra project."; exit 1; }
          }

          check_file "$ANSIBLE_INVENTORY_KEY"
          echo "The required files were found."

      # - name: Download inventory file
      #   run: |
      #     aws s3 cp "s3://${{ github.event.client_payload.bucket }}/${{ github.event.client_payload.key }}" \
      #       "${{ github.event.client_payload.key }}" --endpoint-url="${{ github.event.client_payload.endpoint }}"

      - name: Download inventory file
        run: |
          aws s3 cp "s3://${{ fromJSON(env.YC_INFRA_BUCKET).name }}/$ANSIBLE_INVENTORY_KEY" \
            "$ANSIBLE_INVENTORY_KEY" --endpoint-url="$TF_BACKEND_S3"

      - name: Install Ansible requirements
        run: ansible-galaxy collection install -r requirements.yml

      - name: Run Ansible playbook
        run: ansible-playbook -i "$ANSIBLE_INVENTORY_KEY" main.yml
