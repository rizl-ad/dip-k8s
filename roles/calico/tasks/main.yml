---
# tasks file for calico
- name: Install Calico CNI-plugin
  when: ansible_host == apiserver_advertise_address
  block:
    - name: Check Kubernetes API
      kubernetes.core.k8s_info:
        kind: Node
      register: calico_node_list
      until:
        - calico_node_list.resources is defined
        - calico_node_list.resources | length > 0
      retries: 10
      delay: 10
      ignore_errors: false

    - name: Install operator CRDs
      kubernetes.core.k8s:
        state: present
        src: "{{ calico_operator_crds_url }}"

    - name: Install Tigera operator
      kubernetes.core.k8s:
        state: present
        src: "{{ calico_tigera_operator_url }}"

    - name: Get custom resources
      ansible.builtin.get_url:
        url: "{{ calico_custom_resources_url }}"
        dest: "/tmp/custom-resources.yaml"
        mode: "0644"

    - name: Configure pod network CIDR and encapsulation
      ansible.builtin.replace:
        path: "/tmp/custom-resources.yaml"
        regexp: "{{ item.regexp }}"
        replace: "{{ item.replace }}"
      loop:
        - { regexp: 'cidr: 192\.168\.0\.0/16', replace: "cidr: {{ calico_pod_network_cidr }}" }
        - { regexp: 'encapsulation: VXLANCrossSubnet', replace: 'encapsulation: {{ calico_encapsulation }}' }

    - name: Apply custom resources
      kubernetes.core.k8s:
        state: present
        src: "/tmp/custom-resources.yaml"

    - name: Wait for Calico pods to run
      kubernetes.core.k8s_info:
        kind: Pod
        namespace: calico-system
        label_selectors:
          - k8s-app=calico-node
      register: calico_pods
      until: >
        calico_pods.resources | length > 0 and
        calico_pods.resources | map(attribute='status.phase') | unique | list == ['Running']
      retries: 30
      delay: 10
