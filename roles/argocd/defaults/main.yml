---
# defaults file for argocd
app_name: "{{ lookup('env', 'APP_NAME') }}"
app_namespace: "{{ lookup('env', 'APP_NAMESPACE') }}"
argocd_admin_password: "{{ lookup('env', 'ARGOCD_ADMIN_PASSWORD') }}"
argocd_namespace: argocd
github_repo_url: "{{ lookup('env', 'GITHUB_REPO_URL') }}"
guthub_target: "{{ lookup('env', 'GUTHUB_TARGET') }}"
sa_key_file_path: "{{ lookup('env', 'YC_INFRA_SA_KEY_FILE_PATH') }}"
