    #         labels:
    #           app.kubernetes.io/name: argocd-cmd-params-cm
    #           app.kubernetes.io/part-of: argocd
    #       data:
    #         # server.insecure: "true"
    #         server.basehref: "/argocd"
    #         server.rootpath: "/argocd"

    # - name: Create ArgoCD Ingress rule
    #   kubernetes.core.k8s:
    #     state: present
    #     definition:
    #       apiVersion: networking.k8s.io/v1
    #       kind: Ingress
    #       metadata:
    #         name: argocd-server-ingress
    #         namespace: "{{ argocd_namespace }}"
    #         annotations:
    #           nginx.ingress.kubernetes.io/backend-protocol: "HTTPS"   # Обязательно: ArgoCD внутри пода использует HTTPS
    #           nginx.ingress.kubernetes.io/proxy-ssl-verify: "off"     # Отключаем проверку сертификата между Nginx и подом ArgoCD
    #           nginx.ingress.kubernetes.io/force-ssl-redirect: "false"
    #           # nginx.ingress.kubernetes.io/backend-protocol: "HTTP"
    #           # nginx.ingress.kubernetes.io/backend-protocol: "HTTPS"
    #           # nginx.ingress.kubernetes.io/force-ssl-redirect: "true"
    #           # nginx.ingress.kubernetes.io/ssl-passthrough: "true"
    #       spec:
    #         ingressClassName: nginx
    #         rules:
    #           - http:
    #               paths:
    #                 - path: /argocd
    #                   pathType: Prefix
    #                   backend:
    #                     service:
    #                       name: argocd-server
    #                       port:
    #                         number: 443
    #                         # name: https

    - name: Configure ArgoCD ConfigMap for path-based routing
      kubernetes.core.k8s:
        state: patched
        kind: ConfigMap
        name: argocd-cmd-params-cm
        namespace: "{{ argocd_namespace }}"
        definition:
          data:
            server.basehref: "/argocd"
            server.rootpath: "/argocd"
            # server.insecure: "true"

    - name: Restart argocd-server
      kubernetes.core.k8s:
        state: patched
        kind: Deployment
        name: argocd-server
        namespace: "{{ argocd_namespace }}"
        definition:
          spec:
            template:
              metadata:
                annotations:
                  kubectl.kubernetes.io/restartedAt: "{{ ansible_date_time.iso8601 }}"

    - name: Create ArgoCD Ingress rule
      kubernetes.core.k8s:
        state: present
        definition:
          apiVersion: networking.k8s.io/v1
          kind: Ingress
          metadata:
            name: argocd-server-ingress
            namespace: "{{ argocd_namespace }}"
            annotations:
              nginx.ingress.kubernetes.io/backend-protocol: "HTTPS"
              nginx.ingress.kubernetes.io/proxy-ssl-verify: "off"
              nginx.ingress.kubernetes.io/x-forwarded-prefix: "/argocd"
          spec:
            rules:
              - http:
                  paths:
                    - path: /argocd
                      pathType: Prefix
                      backend:
                        service:
                          name: argocd-server
                          port:
                            number: 443
