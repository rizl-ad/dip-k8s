---
# tasks file for k8s_master
- name: Check Kubernetes cluster initialization
  become: true
  ansible.builtin.stat:
    path: /etc/kubernetes/admin.conf
    # path: /etc/kubernetes/kubelet.conf
  register: check_init_kubeadm

- name: Get join commands
  when:
    - check_init_kubeadm.stat.exists
    - ansible_host == apiserver_advertise_address
  block:
    - name: Get join command for worker-nodes
      no_log: true
      diff: false
      become: true
      ansible.builtin.command: kubeadm token create --print-join-command
      register: join_worker
      changed_when: "'kubeadm join' in join_worker.stdout"

    - name: Get join command for master-nodes
      no_log: true
      diff: false
      become: true
      ansible.builtin.shell: set -o pipefail && kubeadm init phase upload-certs --upload-certs | tail -1
      register: cert_key
      changed_when: cert_key.stdout != ""

    - name: Publish join command and first master name
      no_log: true
      diff: false
      ansible.builtin.add_host:
        name: "K8s_data"
        main_master_name: "{{ inventory_hostname }}"
        join_worker_cmd: "{{ join_worker.stdout }}"
        join_master_cmd: "{{ join_worker.stdout }} --control-plane --certificate-key {{ cert_key.stdout }}"

- name: Init Kubernetes cluster
  when:
    - not check_init_kubeadm.stat.exists
    - ansible_host == apiserver_advertise_address
    - "'K8s_data' not in hostvars"
  block:
    - name: Kubeadm init on first master
      block:
        - name: Kubeadm init
          become: true
          no_log: true
          diff: false
          ansible.builtin.command: >
            sudo kubeadm init
            --apiserver-advertise-address={{ apiserver_advertise_address }}
            --pod-network-cidr {{ pod_network_cidr }}
            --apiserver-cert-extra-sans={{ apiserver_cert_extra_sans }}
            --control-plane-endpoint={{ control_plane_endpoint }}
            --upload-certs
          register: kubeadm_init_result
          changed_when: "'initialized successfully' in kubeadm_init_result.stdout"
      rescue:
        - name: Kubeadm reset
          become: true
          ansible.builtin.command: |
            sudo kubeadm reset -f
            sudo rm -rf /etc/cni/net.d
          register: kubeadm_reset_result
          changed_when: "'remove them manully' in kubeadm_reset_result.stdout"

    - name: Prepare Kubernetes
      when: kubeadm_init_result.rc == 0
      block:
        - name: Create .kube directory
          ansible.builtin.file:
            path: "{{ ansible_env.HOME }}/.kube"
            owner: "{{ ansible_user | default(ansible_env.USER) }}"
            group: "{{ ansible_user | default(ansible_env.USER) }}"
            state: directory
            mode: "0755"

        - name: Copy admin.conf to .kube/config
          become: true
          no_log: true
          diff: false
          ansible.builtin.copy:
            src: /etc/kubernetes/admin.conf
            dest: "{{ ansible_env.HOME }}/.kube/config"
            owner: "{{ ansible_user | default(ansible_env.USER) }}"
            group: "{{ ansible_user | default(ansible_env.USER) }}"
            remote_src: true
            mode: "0644"

        - name: Get join command for worker-nodes
          become: true
          no_log: true
          diff: false
          ansible.builtin.command: kubeadm token create --print-join-command
          register: join_worker
          changed_when: "'kubeadm join' in join_worker.stdout"

        - name: Get join command for master-nodes
          become: true
          no_log: true
          diff: false
          ansible.builtin.shell: set -o pipefail && kubeadm init phase upload-certs --upload-certs | tail -1
          register: cert_key
          changed_when: cert_key.stdout != ""

        - name: Publish join command and first master name
          no_log: true
          diff: false
          ansible.builtin.add_host:
            name: "K8s_data"
            main_master_name: "{{ inventory_hostname }}"
            join_worker_cmd: "{{ join_worker.stdout }}"
            join_master_cmd: "{{ join_worker.stdout }} --control-plane --certificate-key {{ cert_key.stdout }}"

- name: Join master-node to Kubernetes cluster
  become: true
  no_log: true
  diff: false
  ansible.builtin.command: "{{ hostvars['K8s_data']['join_master_cmd'] }}"
  when:
    - not check_init_kubeadm.stat.exists
    - ansible_host != apiserver_advertise_address
    - "'K8s_data' in hostvars"
  register: kubeadm_join_result
  changed_when: "'node has joined the cluster' in kubeadm_join_result.stdout"
